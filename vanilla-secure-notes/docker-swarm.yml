services:

  vanilla-vaultnote:

    image: therahulpatil/vanilla-secure-notes:latest

    ports:
      - "9300:80"

    deploy:

      replicas: 2

      restart_policy:
        condition: any

      update_config:
        parallelism: 1
        delay: 10s
        order: start-first

      rollback_config:
        parallelism: 1
        order: stop-first

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

    security_opt:
      - no-new-privileges:true

    tmpfs:
      - /var/cache/nginx
      - /var/run
